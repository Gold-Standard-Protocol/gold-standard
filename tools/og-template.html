<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Gold Standard social card</title>
    <!--
      Source for apps/dapp/public/og.png, rendered at 1200 by 630 by tools/render-og.mjs.
      Palette, type and motifs follow DESIGN.md: paper ground, Fraunces display, Hanken
      Grotesk body, antique gold as the one accent, corner registration ticks. The gold
      headline phrase is the hero's identity motif and this card is the hero in social form.
      No figures: the card makes no claim the landing page does not.
    -->
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 400 700;
        src: url(../apps/dapp/public/fonts/fraunces-normal-400-700-latin.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Hanken Grotesk';
        font-style: normal;
        font-weight: 400 700;
        src: url(../apps/dapp/public/fonts/hanken-grotesk-normal-400-700-latin.woff2) format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        src: url(../apps/dapp/public/fonts/ibm-plex-mono-normal-500-latin.woff2) format('woff2');
      }
      :root {
        --paper: #fcfaf8;
        --ink: #23201a;
        --muted: #736e64;
        --gold: #87651d;
        --gold-deep: #6f5217;
        --gold-light: #fbf6ea;
        --hairline: #e8e5de;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Hanken Grotesk', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 72px 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      /* Registration ticks at the corners, the mint's die marks. */
      .tick {
        position: absolute;
        width: 28px;
        height: 28px;
        border-color: var(--gold);
        border-style: solid;
        border-width: 0;
      }
      .tick.tl { top: 28px; left: 28px; border-top-width: 1.5px; border-left-width: 1.5px; }
      .tick.tr { top: 28px; right: 28px; border-top-width: 1.5px; border-right-width: 1.5px; }
      .tick.bl { bottom: 28px; left: 28px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
      .tick.br { bottom: 28px; right: 28px; border-bottom-width: 1.5px; border-right-width: 1.5px; }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .seal {
        width: 56px;
        height: 56px;
        display: block;
        flex-shrink: 0;
      }
      .wordmark .name {
        font-family: 'Fraunces', serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1;
      }
      .wordmark .kind {
        margin-top: 6px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .headline {
        font-family: 'Fraunces', serif;
        font-size: 84px;
        font-weight: 500;
        line-height: 1.02;
        letter-spacing: -0.02em;
        max-width: 1000px;
        font-variation-settings: 'opsz' 144;
      }
      .headline .gold {
        color: var(--gold);
      }
      .rule {
        width: 96px;
        height: 1.5px;
        background: var(--gold);
        margin: 28px 0 24px;
      }
      .sub {
        font-size: 27px;
        line-height: 1.4;
        color: var(--muted);
        max-width: 920px;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--hairline);
        padding-top: 20px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .foot .domain {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="tick tl"></span>
      <span class="tick tr"></span>
      <span class="tick bl"></span>
      <span class="tick br"></span>

      <div class="wordmark">
        <svg class="seal" width="56" height="56" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="og-face" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#C6982E" />
              <stop offset="52%" stop-color="#A67A1D" />
              <stop offset="100%" stop-color="#835D13" />
            </linearGradient>
            <linearGradient id="og-rim" x1="7.5" y1="7.5" x2="56.5" y2="56.5" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FBF0C4" stop-opacity="0.65" />
              <stop offset="50%" stop-color="#E6C367" stop-opacity="0.22" />
              <stop offset="100%" stop-color="#6B4A0D" stop-opacity="0.48" />
            </linearGradient>
          </defs>
          <polygon points="20,3 44,3 61,20 61,44 44,61 20,61 3,44 3,20" fill="#B68A25" />
          <polygon points="3,20 20,3 21.85,7.5 7.5,21.85" fill="#F7E29C" />
          <polygon points="20,3 44,3 42.15,7.5 21.85,7.5" fill="#EED077" />
          <polygon points="3,44 3,20 7.5,21.85 7.5,42.15" fill="#DBB856" />
          <polygon points="44,3 61,20 56.5,21.85 42.15,7.5" fill="#C99F3A" />
          <polygon points="20,61 3,44 7.5,42.15 21.85,56.5" fill="#A57B20" />
          <polygon points="61,20 61,44 56.5,42.15 56.5,21.85" fill="#946C18" />
          <polygon points="44,61 20,61 21.85,56.5 42.15,56.5" fill="#866114" />
          <polygon points="61,44 44,61 42.15,56.5 56.5,42.15" fill="#7C5912" />
          <polygon points="21.85,7.5 42.15,7.5 56.5,21.85 56.5,42.15 42.15,56.5 21.85,56.5 7.5,42.15 7.5,21.85" fill="url(#og-face)" stroke="url(#og-rim)" stroke-width="1" />
          <g transform="translate(0 1)" fill="#4D3306" fill-opacity="0.26">
            <path d="M 43.22 21.16 A 15.6 15.6 0 1 0 47.42 29.65 L 38.2 29.65 L 38.2 34.35 L 42.34 34.35 A 10.6 10.6 0 1 1 39.63 24.64 Z" />
            <circle cx="32" cy="32" r="3.2" />
            <rect x="30.2" y="11.4" width="3.6" height="5.2" />
            <rect x="30.2" y="47.4" width="3.6" height="5.2" />
          </g>
          <g fill="#FFFFFF">
            <path d="M 43.22 21.16 A 15.6 15.6 0 1 0 47.42 29.65 L 38.2 29.65 L 38.2 34.35 L 42.34 34.35 A 10.6 10.6 0 1 1 39.63 24.64 Z" />
            <circle cx="32" cy="32" r="3.2" />
            <rect x="30.2" y="11.4" width="3.6" height="5.2" />
            <rect x="30.2" y="47.4" width="3.6" height="5.2" />
          </g>
        </svg>
        <span>
          <div class="name">Gold Standard</div>
          <div class="kind">Gold Standard Dollar</div>
        </span>
      </div>

      <div>
        <h1 class="headline">The dollar,<br /><span class="gold">back on the gold standard.</span></h1>
        <div class="rule"></div>
        <p class="sub">
          GSUSD is a stablecoin over-collateralised by tokenised gold and convertible to
          protocol-owned gold through the Stability Reserve.
        </p>
      </div>

      <div class="foot">
        <span class="domain">goldstandard.finance</span>
        <span>Mint GSUSD against tokenised gold</span>
      </div>
    </div>
  </body>
</html>
